name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar carpeta www
        run: |
          if [ ! -f www/index.html ]; then
            SRC=$(find . -name index.html -not -path "./node_modules/*" -not -path "./android/*" | head -1)
            if [ -z "$SRC" ]; then echo "No se encontro index.html en el repositorio"; exit 1; fi
            echo "Encontrado: $SRC"
            D=$(dirname "$SRC")
            mkdir -p www
            for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
              if [ -f "$D/$f" ] && [ "$D/$f" != "www/$f" ] && [ "./$D/$f" != "./www/$f" ]; then cp "$D/$f" www/; fi
            done
          fi
          ls www
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiniDoom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
